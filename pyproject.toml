[project]
name = "wpg"
version = "0.1.1"
description = "Wildlife Protection Game"
authors = [{name = "Gabriel Moreno", email = "gmoreno@sei.cmu.edu"}]
requires-python = ">=3.11"
dynamic = ["optional-dependencies"]
dependencies = [
    "panzi-json-logic>=1.0.1",
    "py_trees>=2.4",
    "pygame-ce>=2.5",
    "hydra-core>=1.3",
    "numpy>=2.4",
    "pandas>=3.0",
    "pydot>=4.0",
    "pyarrow>=23.0",
    "pathfinding>=1.0.21"
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
wpg = ["conf/**/*.yaml", "strategies.json"]
"wpg.visualizer" = ["sprites/*.png"]
adapt = ["**/*.json"]

[tool.setuptools.dynamic]
optional-dependencies = {dev = {file = ["dev-requirements.txt"]}} # add packages for development in the dev-requirements.txt file

[project.scripts]
wpg = "wpg.__main__:main"
wpg-viz = "wpg.visualizer.cli:main"
wpg-exp = "wpg.exporter.exporter:main"

