calculator:
  _target_: wpg.moe.WeightedMoeCalculator
  _convert_: all

  results:
    SUCCESS:
      range: [800, 1000]
      weights:
        mission_duration: 0.2
        drone_visible_time: 0.3
        drone_in_gun_range_time: 0.5

    POACHER_NOT_ID:
      range: [500, 799]
      weights:
        mission_duration: 0.05
        drone_visible_time: 0.05
        drone_in_gun_range_time: 0.2
        poacher_tracking_time: 0.2
        poacher_imaging_time: 0.5

    POACHER_NOT_FOUND:
      range: [200, 499]
      weights:
        mission_duration: 0.25
        drone_visible_time: 0.25
        drone_in_gun_range_time: 0.5

    DRONE_LOST:
      range: [0, 199]
      weights:
        mission_duration: 0.25
        drone_visible_time: 0.25
        drone_in_gun_range_time: 0.5
